apiVersion: batch/v1
kind: CronJob
metadata:
  name: evalai-remote-worker
  namespace: evalai-poc
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: runner
            image: ghcr.io/kmom88/evalaistartertest:latest 
            imagePullPolicy: Always
            envFrom:
            - secretRef:
                name: evalai-runner-secrets
            env:
            - name: SAVE_DIR
              value: "/tmp"
          restartPolicy: OnFailure